; ============================================
; BACKGROUND
; ============================================
[Background]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,(#ListY# + [MeasureSlots] * #SlotHeight# + #BottomPadding#),#CornerRadius# | Fill Color #BackgroundColor# | Stroke Color #AccentColor# | StrokeWidth 1
DynamicVariables=1

; ============================================
; HEADER
; ============================================
[TitleIcon]
Meter=String
X=#WidgetPadding#
Y=#HeaderY#
FontFace=#FontFace#
FontSize=#FontSizeIcon#
FontColor=#TextColorBright#
Text=[\x266B]
AntiAlias=1
DynamicVariables=1

[Title]
Meter=String
X=#GapWide#R
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeTitle#
FontWeight=600
FontColor=#TextColorBright#
Text=Now Playing
AntiAlias=1
DynamicVariables=1

; Live indicator. Colour is driven by MeasureHealth; green / red.
[StatusIndicator]
Meter=String
X=#GapLabel#R
Y=(#HeaderY# + #StatusDotOffset#)
FontFace=#FontFace#
FontSize=#FontSizeSmall#
FontColor=#NormalColor#
Text=[\x25CF]
AntiAlias=1
DynamicVariables=1
ToolTipText=Watcher: [MeasureStatus], last snapshot [MeasureAgoText]s ago at [MeasureUpdated]#CRLF#[MeasureMessage]

; How long a source stays listed after it goes quiet. Rainmeter gives a skin
; one custom menu, so this opens the same one as the gear, which has a section
; for each setting.
[HoldIcon]
Meter=String
X=(#WidgetWidth# - #WidgetPadding# - #HoldOffset#)
Y=#HeaderY#
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#TextColorDim#
Text=[\x231B]
AntiAlias=1
DynamicVariables=1
MouseOverAction=[!SetOption HoldIcon FontColor #TextColorBright#][!SetOption HoldValue FontColor #TextColorBright#][!Redraw]
MouseLeaveAction=[!SetOption HoldIcon FontColor #TextColorDim#][!SetOption HoldValue FontColor #HighlightColor#][!Redraw]
LeftMouseUpAction=[!SkinCustomMenu]
ToolTipText=How long an app stays listed after it goes quiet

[HoldValue]
Meter=String
X=#GapTiny#R
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#HighlightColor#
Text=#HoldSeconds#s
AntiAlias=1
DynamicVariables=1
MouseOverAction=[!SetOption HoldIcon FontColor #TextColorBright#][!SetOption HoldValue FontColor #TextColorBright#][!Redraw]
MouseLeaveAction=[!SetOption HoldIcon FontColor #TextColorDim#][!SetOption HoldValue FontColor #HighlightColor#][!Redraw]
LeftMouseUpAction=[!SkinCustomMenu]
ToolTipText=How long an app stays listed after it goes quiet

[SettingsGear]
Meter=String
X=(#WidgetWidth# - #WidgetPadding# - #GearOffset#)
Y=#HeaderY#
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#TextColorDim#
Text=[\x2699]
AntiAlias=1
DynamicVariables=1
MouseOverAction=[!SetOption SettingsGear FontColor #TextColorBright#][!SetOption SettingsInterval FontColor #TextColorBright#][!Redraw]
MouseLeaveAction=[!SetOption SettingsGear FontColor #TextColorDim#][!SetOption SettingsInterval FontColor #HighlightColor#][!Redraw]
LeftMouseUpAction=[!SkinCustomMenu]
ToolTipText=Refresh interval and widget size

[SettingsInterval]
Meter=String
X=#GapTiny#R
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#HighlightColor#
Text=#RefreshInterval#s
AntiAlias=1
DynamicVariables=1
MouseOverAction=[!SetOption SettingsGear FontColor #TextColorBright#][!SetOption SettingsInterval FontColor #TextColorBright#][!Redraw]
MouseLeaveAction=[!SetOption SettingsGear FontColor #TextColorDim#][!SetOption SettingsInterval FontColor #HighlightColor#][!Redraw]
LeftMouseUpAction=[!SkinCustomMenu]
ToolTipText=Refresh interval and widget size

[RefreshButton]
Meter=String
X=(#WidgetWidth# - #WidgetPadding#)
Y=#HeaderY#
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#TextColorDim#
StringAlign=Right
Text=[\x21BB]
AntiAlias=1
DynamicVariables=1
MouseOverAction=[!SetOption RefreshButton FontColor #TextColorBright#][!Redraw]
MouseLeaveAction=[!SetOption RefreshButton FontColor #TextColorDim#][!Redraw]
LeftMouseUpAction=[!Refresh]
ToolTipText=Restart the watcher

; ============================================
; AUDIO
; ============================================
[SectionAudio]
Meter=String
X=#WidgetPadding#
Y=#SectionY#
FontFace=#FontFace#
FontSize=#FontSizeSection#
FontWeight=700
FontColor=#SectionColor#
Text=AUDIO
AntiAlias=1
DynamicVariables=1

[SectionAudioCount]
Meter=String
MeasureName=MeasureCount
X=#GapLabel#R
Y=0r
H=#SectionHeight#
FontFace=#FontFace#
