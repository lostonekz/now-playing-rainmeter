[EmptyText]
Meter=String
X=#WidgetPadding#
Y=#ListY#
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#TextColorDim#
Text=Nothing is playing
AntiAlias=1
Hidden=1
DynamicVariables=1

; ============================================
; ROWS
; Fixed slots, filled from the top. Unused ones are hidden and the
; footer moves up to meet the last row in use.
; ============================================
; ---- Slot 1 ----
; An unused slot parks at the top of the card. Hidden meters draw nothing but
; still count toward DynamicWindowSize at their position, so slots left at
; their row would stretch the window down to the sixth row: invisible, but
; KeepOnScreen then stops the widget that far from the screen edge.
; Click target for the whole row, drawn under the text so the detail tooltip
; still works. Near-transparent rather than clear: a fully clear pixel does not
; take clicks.
[Slot1Hit]
Meter=Image
Group=Slot1
X=(#WidgetPadding# - #HitInset#)
Y=(([MeasureCount] > 0) ? (#ListY# + 0 * #SlotHeight# - #HitInset#) : 0)
W=(#BarWidth# + 2 * #HitInset#)
H=(#SlotHeight# - #HitInset#)
SolidColor=#RowIdleColor#
DynamicVariables=1
MouseOverAction=[!SetOption Slot1Hit SolidColor #RowHoverColor#][!UpdateMeter Slot1Hit][!Redraw]
MouseLeaveAction=[!SetOption Slot1Hit SolidColor #RowIdleColor#][!UpdateMeter Slot1Hit][!Redraw]
LeftMouseUpAction=[!SetVariable FocusHwnd [MeasureHwnd1]][!SetVariable FocusProc "[MeasureProc1]"][!UpdateMeasure MeasureFocus][!CommandMeasure MeasureFocus "Run"]

[Slot1Name]
Meter=String
MeasureName=MeasureApp1
Group=Slot1
X=#WidgetPadding#
Y=(([MeasureCount] > 0) ? (#ListY# + 0 * #SlotHeight#) : 0)
W=(#BarWidth# - #ValueColumn#)
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontWeight=500
FontColor=#TextColor#
Text=%1
ClipString=1
AntiAlias=1
DynamicVariables=1

[Slot1Value]
