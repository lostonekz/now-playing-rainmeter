[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Variables.inc
OnRefreshAction=[!CommandMeasure MeasureScript "Run"]

; Custom context menu for settings
ContextTitle=Refresh Interval
ContextAction=[!Log "Settings menu header"]
ContextTitle2=1 second
ContextAction2=[!WriteKeyValue Variables RefreshInterval 1 "#@#Variables.inc"][!Refresh]
ContextTitle3=2 seconds (default)
ContextAction3=[!WriteKeyValue Variables RefreshInterval 2 "#@#Variables.inc"][!Refresh]
ContextTitle4=5 seconds
ContextAction4=[!WriteKeyValue Variables RefreshInterval 5 "#@#Variables.inc"][!Refresh]
ContextTitle5=10 seconds
ContextAction5=[!WriteKeyValue Variables RefreshInterval 10 "#@#Variables.inc"][!Refresh]
ContextTitle6=-
ContextTitle7=Keep Visible After Playing
ContextAction7=[!Log "Settings menu header"]
ContextTitle8=5 seconds
ContextAction8=[!WriteKeyValue Variables HoldSeconds 5 "#@#Variables.inc"][!Refresh]
ContextTitle9=10 seconds (default)
ContextAction9=[!WriteKeyValue Variables HoldSeconds 10 "#@#Variables.inc"][!Refresh]
ContextTitle10=20 seconds
ContextAction10=[!WriteKeyValue Variables HoldSeconds 20 "#@#Variables.inc"][!Refresh]
ContextTitle11=30 seconds
ContextAction11=[!WriteKeyValue Variables HoldSeconds 30 "#@#Variables.inc"][!Refresh]
ContextTitle12=60 seconds
ContextAction12=[!WriteKeyValue Variables HoldSeconds 60 "#@#Variables.inc"][!Refresh]
ContextTitle13=-
ContextTitle14=Size 100%
ContextAction14=[!WriteKeyValue Variables Scale 1 "#@#Variables.inc"][!Refresh]
ContextTitle15=Size 150%
ContextAction15=[!WriteKeyValue Variables Scale 1.5 "#@#Variables.inc"][!Refresh]
ContextTitle16=Size 200%
ContextAction16=[!WriteKeyValue Variables Scale 2 "#@#Variables.inc"][!Refresh]
ContextTitle17=Size 250%
ContextAction17=[!WriteKeyValue Variables Scale 2.5 "#@#Variables.inc"][!Refresh]

; ============================================
; METADATA
; ============================================
[Metadata]
Name=Now Playing
Author=Gabriel Rossetto
Version=1.1.1
License=MIT
Information=Which applications are playing audio right now, with the track, the browser tab or the window title of each. Styled after the AI Usage widget.

; ============================================
; VARIABLES - Dynamic calculations
; ============================================
[Variables]
LastUpdateTick=0
StatusError=0
FocusHwnd=0
FocusProc=none

; ============================================
; SCRIPT EXECUTION
; ============================================
; The script is a long-lived loop that rewrites now.txt every RefreshInterval
; seconds. Running it again (a refresh) makes the new copy take over from the
; old one, and the loop exits by itself once Rainmeter is gone.
[MeasureScript]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#ScriptPath#" -Interval #RefreshInterval# -HoldSeconds #HoldSeconds# -MaxSlots #MaxSlots#
State=Hide
OutputType=UTF8
DynamicVariables=1

; Watchdog: if no snapshot arrived for a while, start the script again.
; Fires on the tick the condition turns true, then every 30 s while stale.
[MeasureWatchdog]
Measure=Calc
Formula=MeasureSecondsAgo
IfCondition=(MeasureSecondsAgo > (#RefreshInterval# * 3 + 10)) && ((MeasureSecondsAgo % 30) = 0)
IfTrueAction=[!CommandMeasure MeasureScript "Run"]
DynamicVariables=1

; Brings the clicked row's app to the front - for a browser, the tab making
; sound. A row click sets FocusHwnd and FocusProc, updates this measure
; so the new values reach the parameter, then runs it.
[MeasureFocus]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#FocusScriptPath#" -Hwnd #FocusHwnd# -Process #FocusProc#
State=Hide
DynamicVariables=1

; ============================================
; SNAPSHOT PARSING
; ============================================
; now.txt is key=value lines in a fixed order, always with every slot present
; (empty when unused), so one regex captures the lot.
; Groups: 1=status 2=message 3=count 4=seq 5=updated
;         then per slot N, base = 5 + (N-1)*7:
;         +1=app +2=label +3=detail +4=level +5=state +6=hwnd +7=proc
[MeasureSnapshot]
Measure=Plugin
Plugin=WebParser
URL=file://%APPDATA%\NowPlaying\now.txt
CodePage=65001
RegExp=(?sm)^status=([^\r\n]*)$.*?^message=([^\r\n]*)$.*?^count=([^\r\n]*)$.*?^seq=([^\r\n]*)$.*?^updated=([^\r\n]*)$.*?^app1=([^\r\n]*)$.*?^label1=([^\r\n]*)$.*?^detail1=([^\r\n]*)$.*?^level1=([^\r\n]*)$.*?^state1=([^\r\n]*)$.*?^hwnd1=([^\r\n]*)$.*?^proc1=([^\r\n]*)$.*?^app2=([^\r\n]*)$.*?^label2=([^\r\n]*)$.*?^detail2=([^\r\n]*)$.*?^level2=([^\r\n]*)$.*?^state2=([^\r\n]*)$.*?^hwnd2=([^\r\n]*)$.*?^proc2=([^\r\n]*)$.*?^app3=([^\r\n]*)$.*?^label3=([^\r\n]*)$.*?^detail3=([^\r\n]*)$.*?^level3=([^\r\n]*)$.*?^state3=([^\r\n]*)$.*?^hwnd3=([^\r\n]*)$.*?^proc3=([^\r\n]*)$.*?^app4=([^\r\n]*)$.*?^label4=([^\r\n]*)$.*?^detail4=([^\r\n]*)$.*?^level4=([^\r\n]*)$.*?^state4=([^\r\n]*)$.*?^hwnd4=([^\r\n]*)$.*?^proc4=([^\r\n]*)$.*?^app5=([^\r\n]*)$.*?^label5=([^\r\n]*)$.*?^detail5=([^\r\n]*)$.*?^level5=([^\r\n]*)$.*?^state5=([^\r\n]*)$.*?^hwnd5=([^\r\n]*)$.*?^proc5=([^\r\n]*)$.*?^app6=([^\r\n]*)$.*?^label6=([^\r\n]*)$.*?^detail6=([^\r\n]*)$.*?^level6=([^\r\n]*)$.*?^state6=([^\r\n]*)$.*?^hwnd6=([^\r\n]*)$.*?^proc6=([^\r\n]*)$
UpdateRate=1
DynamicVariables=1

; Counter that increments every second (Update=1000 means each tick is 1 second)
[MeasureTotalTicks]
Measure=Calc
Formula=(MeasureTotalTicks + 1)

; Seconds since the last snapshot arrived
[MeasureSecondsAgo]
Measure=Calc
Formula=(MeasureTotalTicks - #LastUpdateTick#)
DynamicVariables=1

; ok, or error with the reason in MeasureMessage
[MeasureStatus]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=1
DynamicVariables=1
IfMatch=^error$
IfMatchAction=[!SetVariable StatusError 1]
IfNotMatchAction=[!SetVariable StatusError 0]

; The header dot: green while snapshots keep coming and the script reports ok,
; red once they stop or it reports an error. Hover it for the reason.
[MeasureHealth]
Measure=Calc
Formula=MeasureSecondsAgo
IfCondition=(MeasureSecondsAgo <= (#RefreshInterval# * 2 + 2)) && (#StatusError# = 0)
IfTrueAction=[!SetOption StatusIndicator FontColor #NormalColor#][!UpdateMeter StatusIndicator][!Redraw]
IfFalseAction=[!SetOption StatusIndicator FontColor #CriticalColor#][!UpdateMeter StatusIndicator][!Redraw]
DynamicVariables=1

; Empty while healthy, so the line costs nothing but never shifts the layout
[MeasureMessage]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=2
DynamicVariables=1

[MeasureCount]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=3
DynamicVariables=1
IfCondition=(MeasureCount = 0)
IfTrueAction=[!ShowMeter EmptyText][!Redraw]
IfFalseAction=[!HideMeter EmptyText][!Redraw]

; Bumped on every write. A change means the script is alive.
[MeasureSeq]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=4
DynamicVariables=1
OnChangeAction=[!SetVariable LastUpdateTick [MeasureTotalTicks]]

[MeasureUpdated]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=5
DynamicVariables=1

; Seconds since the last snapshot, for the dot's tooltip
[MeasureAgoText]
Measure=Calc
Formula=MeasureSecondsAgo
DynamicVariables=1

; Rows to make room for: at least one, for the "nothing playing" line
[MeasureSlots]
Measure=Calc
Formula=Clamp(MeasureCount, 1, #MaxSlots#)
DynamicVariables=1

; ============================================
; SLOT DATA
; ============================================
; ---- Slot 1 ----
; Blank app name = unused slot, hidden
[MeasureApp1]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=6
DynamicVariables=1
IfMatch=^$
IfMatchAction=[!HideMeterGroup Slot1][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Slot1][!Redraw]

; Track, Tab, Media or Window - what the detail line is
[MeasureLabel1]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=7
DynamicVariables=1

[MeasureDetail1]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=8
DynamicVariables=1

; The app's own volume in the Windows mixer, 0-100
[MeasureLevel1]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=9
MinValue=0
MaxValue=100
DynamicVariables=1

; playing = sound right now, quiet = held after it stopped, muted = muted in the mixer
[MeasureState1]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=10
DynamicVariables=1
IfMatch=^playing$
IfMatchAction=[!SetOption Slot1Name FontColor #TextColor#][!SetOption Slot1Value Text "%1%"][!SetOption Slot1Value FontColor #TextColor#][!SetOption Slot1Bar BarColor #BarNormalColor#][!UpdateMeterGroup Slot1][!Redraw]
IfMatch2=^quiet$
IfMatchAction2=[!SetOption Slot1Name FontColor #TextColorDim#][!SetOption Slot1Value Text "%1%"][!SetOption Slot1Value FontColor #TextColorDim#][!SetOption Slot1Bar BarColor #BarQuietColor#][!UpdateMeterGroup Slot1][!Redraw]
IfMatch3=^muted$
IfMatchAction3=[!SetOption Slot1Name FontColor #TextColor#][!SetOption Slot1Value Text "muted"][!SetOption Slot1Value FontColor #WarningColor#][!SetOption Slot1Bar BarColor #BarMutedColor#][!UpdateMeterGroup Slot1][!Redraw]

; Window to bring forward when the row is clicked; 0 = none found
[MeasureHwnd1]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=11
DynamicVariables=1

; Process name, so a click on a browser row can look for the playing tab
[MeasureProc1]
Measure=Plugin
Plugin=WebParser
URL=[MeasureSnapshot]
StringIndex=12
DynamicVariables=1

