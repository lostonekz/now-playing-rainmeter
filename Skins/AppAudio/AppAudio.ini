; ============================================
; BACKGROUND
; ============================================
[Background]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,(#ListY# + [MeasureSlots] * #SlotHeight# + #FooterHeight#),#CornerRadius# | Fill Color #BackgroundColor# | Stroke Color #AccentColor# | StrokeWidth 1
DynamicVariables=1

; ============================================
; HEADER
; ============================================
[TitleIcon]
Meter=String
X=#WidgetPadding#
Y=#HeaderY#
FontFace=#FontFace#
FontSize=#FontSizeIcon#
FontColor=#TextColorBright#
Text=[\x266B]
AntiAlias=1
DynamicVariables=1

[Title]
Meter=String
X=#GapWide#R
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeTitle#
FontWeight=600
FontColor=#TextColorBright#
Text=Now Playing
AntiAlias=1
DynamicVariables=1

[SettingsGear]
Meter=String
X=(#WidgetWidth# - #WidgetPadding# - #GearOffset#)
Y=#HeaderY#
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#TextColorDim#
Text=[\x2699]
AntiAlias=1
DynamicVariables=1
MouseOverAction=[!SetOption SettingsGear FontColor #TextColorBright#][!SetOption SettingsInterval FontColor #TextColorBright#][!Redraw]
MouseLeaveAction=[!SetOption SettingsGear FontColor #TextColorDim#][!SetOption SettingsInterval FontColor #HighlightColor#][!Redraw]
LeftMouseUpAction=[!SkinCustomMenu]
ToolTipText=Refresh interval and widget size

[SettingsInterval]
Meter=String
X=#GapTiny#R
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#HighlightColor#
Text=#RefreshInterval#s
AntiAlias=1
DynamicVariables=1
MouseOverAction=[!SetOption SettingsGear FontColor #TextColorBright#][!SetOption SettingsInterval FontColor #TextColorBright#][!Redraw]
MouseLeaveAction=[!SetOption SettingsGear FontColor #TextColorDim#][!SetOption SettingsInterval FontColor #HighlightColor#][!Redraw]
LeftMouseUpAction=[!SkinCustomMenu]
ToolTipText=Refresh interval and widget size

[RefreshButton]
Meter=String
X=(#WidgetWidth# - #WidgetPadding#)
Y=#HeaderY#
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#TextColorDim#
StringAlign=Right
Text=[\x21BB]
AntiAlias=1
DynamicVariables=1
MouseOverAction=[!SetOption RefreshButton FontColor #TextColorBright#][!Redraw]
MouseLeaveAction=[!SetOption RefreshButton FontColor #TextColorDim#][!Redraw]
LeftMouseUpAction=[!Refresh]
ToolTipText=Restart the watcher

; ============================================
; AUDIO
; ============================================
[SectionAudio]
Meter=String
X=#WidgetPadding#
Y=#SectionY#
FontFace=#FontFace#
FontSize=#FontSizeSection#
FontWeight=700
FontColor=#SectionColor#
Text=AUDIO
AntiAlias=1
DynamicVariables=1

[SectionAudioCount]
Meter=String
MeasureName=MeasureCount
X=#GapLabel#R
Y=0r
H=#SectionHeight#
FontFace=#FontFace#
FontSize=#FontSizeSection#
FontColor=#TextColorDim#
Text=%1 playing
NumOfDecimals=0
AntiAlias=1
DynamicVariables=1

[EmptyText]
Meter=String
X=#WidgetPadding#
Y=#ListY#
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#TextColorDim#
Text=Nothing is playing
AntiAlias=1
Hidden=1
DynamicVariables=1

; ============================================
; ROWS
; Fixed slots, filled from the top. Unused ones are hidden and the
; footer moves up to meet the last row in use.
; ============================================
; ---- Slot 1 ----
[Slot1Name]
Meter=String
MeasureName=MeasureApp1
Group=Slot1
X=#WidgetPadding#
Y=(#ListY# + 0 * #SlotHeight#)
W=(#BarWidth# - #ValueColumn#)
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontWeight=500
FontColor=#TextColor#
Text=%1
ClipString=1
AntiAlias=1
DynamicVariables=1

[Slot1Value]
Meter=String
MeasureName=MeasureLevel1
Group=Slot1
X=(#WidgetWidth# - #WidgetPadding#)
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeLabel#
FontColor=#TextColor#
StringAlign=Right
Text=%1%
NumOfDecimals=0
AntiAlias=1
DynamicVariables=1
ToolTipText=Volume in the Windows mixer

[Slot1Bar]
Meter=Bar
MeasureName=MeasureLevel1
Group=Slot1
X=#WidgetPadding#
Y=#BarGap#R
W=#BarWidth#
H=#BarHeight#
BarColor=#BarNormalColor#
SolidColor=#BarBackgroundColor#
BarOrientation=Horizontal
DynamicVariables=1

[Slot1Label]
Meter=String
MeasureName=MeasureLabel1
Group=Slot1
X=#WidgetPadding#
Y=#TextGap#R
W=#DetailLabelWidth#
FontFace=#FontFace#
FontSize=#FontSizeSmall#
FontColor=#TextColorDim#
